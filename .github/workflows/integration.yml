name: Integration Baseline

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: integration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  integration:
    name: Full-Stack Integration Gate
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: tiketa_test
          POSTGRES_USER: tiketa_test
          POSTGRES_PASSWORD: disposable-test-password
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql+asyncpg://tiketa_test:disposable-test-password@localhost/tiketa_test
      TIKETA_TEST_DATABASE_URL: postgresql+asyncpg://tiketa_test:disposable-test-password@localhost/tiketa_test
      REDIS_URL: redis://localhost:6379/15
      TIKETA_TEST_REDIS_URL: redis://localhost:6379/15
      SECRET_KEY: disposable-test-signing-key-at-least-32-characters
      APP_FIELD_ENCRYPTION_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      ENVIRONMENT: test

    steps:
      - name: Checkout Candidate Repository
        uses: actions/checkout@v4

      # --- Backend Toolchain ---
      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements*.txt

      - name: Install Backend Dev Dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements-dev.txt
          python -m pip check

      - name: Backend Code Quality & Architecture Gate
        run: |
          ruff check backend
          ruff format --check backend
          test -f AGENTS.md && test -f docs/AI-CONTEXT.md

      - name: Run Database Migrations
        working-directory: backend
        run: |
          alembic upgrade head

      - name: Run Backend Test Suite
        working-directory: backend
        run: |
          pytest -q --cov=app --cov=scripts --cov-report=term-missing --cov-report=xml

      - name: Validate OpenAPI Schema Drift
        working-directory: backend
        run: |
          python -m scripts.export_openapi --check

      # --- Frontend Toolchain ---
      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci

      - name: Strict TypeScript Compilation Gate
        working-directory: frontend
        run: npm run type-check

      - name: Production Vite Bundle Gate
        working-directory: frontend
        run: npm run build