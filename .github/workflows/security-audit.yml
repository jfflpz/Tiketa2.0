name: Security & Vulnerability Audit

on:
  push:
    branches: [develop, 'feat/security-*', 'feat/frontend-*', 'feat/ci-*']
  pull_request:
    branches: [develop]
  schedule:
    - cron: '0 0 * * 0' # Every Sunday at midnight UTC
  workflow_dispatch:

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-security:
    name: Backend Python Dependency Audit (pip-audit)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install pip-audit
        run: python -m pip install --upgrade pip pip-audit

      - name: Audit Backend Requirements
        run: pip-audit -r backend/requirements.txt

  frontend-security:
    name: Frontend Node Dependency Audit (npm audit)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Generate High/Moderate Advisory Summary
        working-directory: frontend
        run: |
          echo "### Frontend Dependency Audit Advisory" >> $GITHUB_STEP_SUMMARY
          npm audit --omit=dev || true >> $GITHUB_STEP_SUMMARY

      - name: Enforce Critical Vulnerability Gate
        working-directory: frontend
        run: npm audit --audit-level=critical