services:
  db:
    image: postgres:16-alpine
    container_name: tiketa-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-tiketa_db}
      POSTGRES_USER: ${POSTGRES_USER:-tiketa_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tiketa_secret_dev}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-tiketa_admin} -d ${POSTGRES_DB:-tiketa_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - tiketa-network

  redis:
    image: redis:7-alpine
    container_name: tiketa-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - tiketa-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: tiketa-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    networks:
      - tiketa-network

volumes:
  postgres_data:
  redis_data:

networks:
  tiketa-network:
    driver: bridge
