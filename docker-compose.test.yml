services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: tiketa_test
      POSTGRES_PASSWORD: disposable-test-password
      POSTGRES_DB: tiketa_test
    tmpfs: /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tiketa_test -d tiketa_test"]
      interval: 2s
      timeout: 3s
      retries: 30
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30
  backend:
    build:
      context: ./backend
      target: test
    environment:
      DATABASE_URL: postgresql+asyncpg://tiketa_test:disposable-test-password@db/tiketa_test
      TIKETA_TEST_DATABASE_URL: postgresql+asyncpg://tiketa_test:disposable-test-password@db/tiketa_test
      REDIS_URL: redis://redis:6379/15
      TIKETA_TEST_REDIS_URL: redis://redis:6379/15
      SECRET_KEY: disposable-test-signing-key-at-least-32-characters
      APP_FIELD_ENCRYPTION_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      ENVIRONMENT: test
    volumes:
      - ./backend:/app
      - ./deploy:/app/deploy:ro
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
